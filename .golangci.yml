# Auto-generated file - do not edit manually
# golangci-lint configuration for v2.x
version: 2

# Analysis configuration
run:
  timeout: 3m

# Linters configuration  
linters-settings:
  funlen:
    lines: 100
    statements: 50

  gocognit:
    min-complexity: 20

  govet:
    enable-all: true
    disable:
      - fieldalignment

# Enabled linters
linters:
  disable-all: true
  enable:
    # Default linters (enabled by default)
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    
    # Additional useful linters
    - bodyclose
    - funlen
    - gocognit
    - goconst
    - gosec
    - revive
    - unconvert
    - unparam

# Issues configuration
issues:
  max-same-issues: 50
  exclude-rules:
    - path: "_test\\.go"
      linters:
        - bodyclose
        - funlen
        - goconst
        - gosec